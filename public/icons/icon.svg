<svg id="hisaabLogoSvg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .h-roman {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 190px;
        font-weight: 800;
      }
      .urdu-svg-text {
        font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Arabic Typesetting', 'Segoe UI', sans-serif;
        font-size: 58px;
        font-weight: 700;
      }
      .english-svg-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 10px;
      }
    </style>
    <linearGradient id="hisaabGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#hisaabGradient)"/>
  <g filter="url(#softShadow)">
    <text x="256" y="215" class="h-roman" fill="#FFFFFF" text-anchor="middle">H</text>
    <text x="256" y="340" class="urdu-svg-text" fill="#FFFFFF" text-anchor="middle" direction="rtl" lang="ur" xml:lang="ur">حساب</text>
    <text x="261" y="425" class="english-svg-text" fill="#FFFFFF" opacity="0.92" text-anchor="middle">HISAAB</text>
  </g>
</svg>
